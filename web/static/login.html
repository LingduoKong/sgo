<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · SGO</title><link rel="stylesheet" href="/static/login.css"><script src="/static/login.js" defer></script></head>
<body><main><div class="brand">SGO <span>PRIVATE WORKSPACE</span></div><div class="rule"></div><p class="eyebrow">受邀访问</p><h1>从一个更好的<br>问题开始。</h1><p class="intro">使用获准的邮箱登录，开始你的评审与分析。</p>
<form id="emailForm"><label for="email">邮箱地址</label><input id="email" type="email" autocomplete="email" maxlength="254" placeholder="you@company.com" required><button id="sendCode" type="submit">发送登录验证码 <span aria-hidden="true">→</span></button></form>
<form id="codeForm" hidden><label for="code">邮件中的 8 位验证码</label><input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{8}" minlength="8" maxlength="8" placeholder="00000000" required><button id="verify" type="submit">登录工作区 <span aria-hidden="true">→</span></button><button id="changeEmail" class="secondary" type="button">更换邮箱</button></form>
<p id="status" role="status" aria-live="polite"></p><footer>仅限白名单成员 · 登录后 24 小时内有效</footer></main><aside aria-hidden="true"><div class="symbol">θ<span>↗</span></div><p>Better questions.<br>Clearer decisions.</p></aside></body></html>
